<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Live window and settings panel preview">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202A43"/>
      <stop offset="1" stop-color="#161D33"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8DA6FF"/>
      <stop offset="1" stop-color="#6F8BFF"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="#0F1421"/>

  <!-- Desktop surface behind the live window -->
  <rect x="24" y="30" width="592" height="240" rx="14" fill="#131A2B"/>
  <rect x="40" y="46" width="120" height="9" rx="4.5" fill="#2A3550"/>

  <!-- The live window docked at the top of the screen -->
  <rect x="150" y="70" width="300" height="112" rx="28" fill="url(#panel)" stroke="#3A4767" stroke-width="1"/>
  <rect x="150" y="70" width="300" height="3" rx="1.5" fill="url(#accentBar)"/>

  <!-- Status dot and title bar -->
  <circle cx="180" cy="104" r="6" fill="#8DA6FF"/>
  <rect x="196" y="99" width="116" height="9" rx="4.5" fill="#EDF2FF"/>

  <!-- Reply preview lines -->
  <rect x="180" y="126" width="240" height="8" rx="4" fill="#3E4C6E"/>
  <rect x="180" y="142" width="186" height="8" rx="4" fill="#33405E"/>

  <!-- Balance and cost footer chips -->
  <rect x="180" y="160" width="84" height="7" rx="3.5" fill="#4E5C80"/>
  <rect x="272" y="160" width="56" height="7" rx="3.5" fill="#3E4C6E"/>

  <!-- Approval card -->
  <rect x="150" y="196" width="300" height="66" rx="14" fill="#1B2440" stroke="#4A5A85" stroke-width="1"/>
  <rect x="168" y="212" width="104" height="9" rx="4.5" fill="#EDF2FF"/>
  <rect x="168" y="228" width="150" height="7" rx="3.5" fill="#3E4C6E"/>
  <rect x="168" y="242" width="64" height="16" rx="8" fill="#8DA6FF"/>
  <rect x="240" y="242" width="64" height="16" rx="8" fill="none" stroke="#4A5A85" stroke-width="1"/>

  <!-- Settings panel on the right -->
  <rect x="470" y="70" width="146" height="192" rx="12" fill="#151C2C" stroke="#2C3A58" stroke-width="1"/>

  <!-- Section heading rule -->
  <rect x="486" y="86" width="72" height="9" rx="4.5" fill="#EDF2FF"/>
  <rect x="486" y="101" width="114" height="1" fill="#2C3A58"/>

  <!-- Row with switch on -->
  <rect x="486" y="116" width="66" height="7" rx="3.5" fill="#9AA8C7"/>
  <rect x="576" y="113" width="26" height="15" rx="7.5" fill="#8DA6FF"/>
  <circle cx="594.5" cy="120.5" r="5.5" fill="#FFFFFF"/>

  <!-- Segmented control -->
  <rect x="486" y="146" width="60" height="7" rx="3.5" fill="#9AA8C7"/>
  <rect x="486" y="162" width="46" height="20" rx="6" fill="#8DA6FF"/>
  <rect x="538" y="162" width="34" height="20" rx="6" fill="none" stroke="#3A4767" stroke-width="1"/>

  <!-- Row with switch on -->
  <rect x="486" y="198" width="70" height="7" rx="3.5" fill="#9AA8C7"/>
  <rect x="576" y="195" width="26" height="15" rx="7.5" fill="#8DA6FF"/>
  <circle cx="594.5" cy="202.5" r="5.5" fill="#FFFFFF"/>

  <!-- Row with switch off -->
  <rect x="486" y="228" width="84" height="7" rx="3.5" fill="#9AA8C7"/>
  <rect x="576" y="225" width="26" height="15" rx="7.5" fill="#2C3A58"/>
  <circle cx="583.5" cy="232.5" r="5.5" fill="#7C8AA8"/>
</svg>
